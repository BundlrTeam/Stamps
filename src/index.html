<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="utf-8" />
  <title>Stamp Me</title>
  <meta name="description" content="Cartões de fidelidade digitais - Siga os seus negócios favoritos" />

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- Add to homescreen for iOS -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <!-- Open Graph -->
  <meta property="og:title" content="Stamp Me" />
  <meta property="og:description" content="Cartões de fidelidade digitais - Siga os seus negócios favoritos" />
  <meta property="og:type" content="website" />

  <script>
    (function() {
      const savedTheme = localStorage.getItem('darkMode');
      const isDark = savedTheme === 'true';
      document.documentElement.classList.toggle('ion-palette-dark', isDark);
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
