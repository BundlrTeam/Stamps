<main class="login-page">
    <!-- Splash Welcome Screen -->
    <div class="splash-view app-fade-in" *ngIf="showSplash" (click)="goToLoginForm()" aria-label="Tela de boas-vindas. Clique para entrar.">
      <div class="splash-content">
        <div class="brand-lockup large">
          <img src="assets/brand/stamp-me-mark.svg" alt="Logo do Stamp Me" />
          <span>Stamp Me</span>
        </div>
        <p class="splash-tagline">Seus cartões de fidelidade digitais em um só lugar</p>
        <div class="splash-action">
          <span>Toque em qualquer lugar para começar</span>
          <ion-icon name="arrow-forward-outline" class="pulse-arrow"></ion-icon>
        </div>
      </div>
    </div>

    <!-- Actual Login Form Screen -->
    <section class="login-card app-scale-in" *ngIf="!showSplash" aria-labelledby="login-title">
      <div class="brand-lockup">
        <img src="assets/brand/stamp-me-mark.svg" alt="" />
        <span>Stamp Me</span>
      </div>

      <div class="login-copy">
        <p>Demonstração</p>
        <h1 id="login-title">Entre na sua carteira de recompensas.</h1>
        <span>Use admin / admin para testar o protótipo.</span>
      </div>

      <form (ngSubmit)="login()" class="login-form">
        <ion-list lines="none">
          <ion-item>
            <ion-input
              [(ngModel)]="username"
              name="username"
              label="Usuário"
              labelPlacement="stacked"
              autocomplete="username"
              required
            ></ion-input>
          </ion-item>

          <ion-item>
            <ion-input
              [(ngModel)]="password"
              name="password"
              type="password"
              label="Senha"
              labelPlacement="stacked"
              autocomplete="current-password"
              required
            ></ion-input>
          </ion-item>
        </ion-list>

        <p class="login-error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <ion-button expand="block" shape="round" type="submit">
          Entrar
        </ion-button>
      </form>
    </section>
</main>
