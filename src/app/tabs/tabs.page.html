<ion-tabs>
  <ion-tab-bar slot="bottom" class="app-tab-bar">
    <ion-tab-button tab="home" href="/tabs/home" aria-label="Início" (click)="onHomeTabClick()">
      <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
      <ion-label>Início</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="wallet" href="/tabs/wallet" aria-label="Carteira" (click)="onWalletTabClick()">
      <ion-icon aria-hidden="true" name="albums-outline"></ion-icon>
      <ion-label>Carteira</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile" href="/tabs/profile" aria-label="Perfil">
      <ion-icon aria-hidden="true" name="person-circle-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
